  <section class="seitenkopf">
    <div class="breite">
      <nav class="brotkrumen auftritt" aria-label="Pfad"><a href="/">Start</a><span>Auktionshaus</span></nav>
      <h1 class="auftritt" style="--i:1">Auktionshaus live</h1>
      <p class="einleitung auftritt" style="--i:2">Alle Angebote aus dem HugoSMP-Auktionshaus, gelesen von unserem Bot. Neue Angebote erscheinen hier, sobald sie im Spiel drin sind. Kaufen geht nur im Spiel mit <b>/ah</b>.</p>
    </div>
  </section>

  <section class="abschnitt kurz-oben">
    <div class="breite" id="markt" data-bilder="{{BILDER}}">
      <div class="markt-zugang" id="markt-zugang" hidden></div>
      <div id="markt-inhalt" hidden>
        <div class="markt-leiste">
          <label class="suche"><span class="sr">Item suchen</span><input type="search" id="markt-suche" placeholder="Item oder Verkäufer …" autocomplete="off" spellcheck="false"></label>
          <label class="feld-klein"><span>Sortieren</span><select id="markt-sort"><option value="neu">Neueste zuerst</option><option value="billig">Günstigste pro Stück</option><option value="teuer">Teuerste zuerst</option><option value="name">Name A bis Z</option></select></label>
          <label class="haken"><input type="checkbox" id="markt-fake" checked> Umbenannte Fakes ausblenden</label>
        </div>
        <p class="markt-stand" id="markt-stand" aria-live="polite"></p>
        <ol class="markt-liste" id="markt-liste"></ol>
        <details class="markt-weg" id="markt-weg" hidden><summary>Gerade verkauft oder abgelaufen</summary><ol class="markt-liste klein" id="markt-weg-liste"></ol></details>
      </div>
      <p class="leer" id="markt-lade">Auktionshaus wird geladen …</p>
    </div>
  </section>
