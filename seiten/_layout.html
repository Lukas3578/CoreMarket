<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITEL}}</title>
<meta name="description" content="{{BESCHREIBUNG}}">
<link rel="canonical" href="{{PFAD}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CoreMarket">
<meta property="og:title" content="{{TITEL}}">
<meta property="og:description" content="{{BESCHREIBUNG}}">
<meta property="og:image" content="/logo.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#14101c">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-seite="{{SEITE}}" data-bilder="{{BILDER}}">
<a class="skip" href="#inhalt">Zum Inhalt springen</a>

<header class="leiste-oben" id="kopf">
  <button class="leiste-knopf" id="leiste-knopf" type="button" aria-label="Menü ein- oder ausklappen" aria-controls="seitenleiste" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="marke" href="/"><img src="/logo.png" alt="" width="34" height="34"><span id="marke">CoreMarket</span></a>
  <p class="online" id="online" hidden><span class="punkt an"></span><b id="online-zahl">0</b><span class="online-text"> Spieler auf HugoSMP</span></p>
  <div class="globalsuche" id="globalsuche">
    <label class="gs-feld">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">Suchen</span>
      <input type="search" id="gs-eingabe" placeholder="Spawner, Spieler, Items, Wiki …" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="gs-treffer" aria-autocomplete="list">
      <kbd class="gs-taste" aria-hidden="true">/</kbd>
    </label>
    <div class="gs-treffer" id="gs-treffer" role="listbox" aria-label="Suchergebnisse" hidden></div>
  </div>
  <button class="gs-mobil" id="gs-mobil" type="button" aria-label="Suchen">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <button class="thema-knopf" id="thema-knopf" type="button" aria-label="Helles Design einschalten" title="Hell oder dunkel">
    <svg class="mond" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sonne" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <a class="knopf klein discord-link" href="{{DISCORD}}" target="_blank" rel="noopener">Discord</a>
</header>

<nav class="seitenleiste" id="seitenleiste" aria-label="Hauptmenü">{{NAV}}</nav>
<div class="leiste-schatten" id="leiste-schatten" hidden></div>

<main id="inhalt">
{{INHALT}}

<footer class="fuss">
  <div class="breite fuss-in">
    <p><span id="marke2">CoreMarket</span> ist ein Spieler-Clan auf HugoSMP. Wir gehören nicht zu HugoSMP, Mojang oder Microsoft. Preise ohne Gewähr – maßgeblich ist der Preis im Ticket.</p>
    <p class="hinweis" id="fuss-stand"></p>
  </div>
</footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<a class="nach-oben" id="nach-oben" href="#" aria-label="Nach oben">↑</a>

<!--START-DATEN-->
<script src="/app.js" defer></script>
</body>
</html>
