services:
  - type: web
    name: coremarket
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COREMARKET_API
        value: https://hugo.vortexpvp.eu/api/public
      - key: DISCORD_INVITE
        value: https://discord.gg/UT6dYchUB
