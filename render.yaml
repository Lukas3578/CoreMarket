services:
  - type: web
    name: coremarket-website
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /config.js
        name: Cache-Control
        value: no-cache
